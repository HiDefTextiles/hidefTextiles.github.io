project:
  type: website
  output-dir: _site
  pre-render: sh scripts/sync-assets.sh
  render:
    - "*.qmd"
    - "prjonavel/*.qmd"
    - "sjonabok/*.qmd"
    - "mynsturgerd/*.qmd"
    - "verkefnid/*.qmd"
  resources:
    # Referenced from CSS (mask-image), which Quarto does not scan
    - img/hi/hi_logo.svg
    - skjol/NSN-2024-lokaskyrsla.pdf
    - skjol/NSN-2024-lokaskyrsla-undirritud.pdf

lang: is
language:
  search-box-placeholder: "Leita"
  toc-title-document: "Á þessari síðu"
  section-title-references: "Heimildir"
  repo-action-links-edit: "Breyta síðunni"
  repo-action-links-issue: "Senda ábendingu"
bibliography: heimildir.bib
csl: apa.csl
link-citations: true

website:
  title: "HiDef textíll"
  description: "Opnar leiðbeiningar um textíl og tækni. Rannsóknarverkefni við Háskóla Íslands."
  site-url: https://hideftextiles.github.io/
  repo-url: https://github.com/HiDefTextiles/hidefTextiles.github.io
  repo-actions: [edit, issue]
  favicon: img/hi/favicon.svg
  search: true
  page-navigation: true
  navbar:
    logo: img/hi/hi_named_logo-is.svg
    logo-alt: "Háskóli Íslands"
    background: primary
    left:
      - text: "Prjónavélin"
        href: prjonavel/index.qmd
      - text: "Sjónabók"
        href: sjonabok/index.qmd
      - text: "Mynsturgerð"
        href: mynsturgerd/index.qmd
      - text: "Verkefnið"
        href: verkefnid/index.qmd
      - text: "Meira"
        menu:
          - text: "Hugbúnaður"
            href: hugbunadur.qmd
          - text: "Nám og fræði"
            href: nam.qmd
          - text: "Orðalisti"
            href: ordalisti.qmd
          - text: "Heimildir"
            href: heimildir.qmd
          - text: "---"
          - text: "Um HiDef textíl"
            href: um.qmd
          - text: "Hafa samband"
            href: samband.qmd
          - text: "Bæta við viðfangsefni"
            href: nytt-vidfangsefni.qmd
    right:
      # Replaced by the EU translator (WEB-T) when it is configured,
      # see _includes/eu-translator.html
      - text: "Translate"
        href: thyding.qmd
        icon: translate
    tools:
      - icon: github
        href: https://github.com/HiDefTextiles
        aria-label: GitHub
  sidebar:
    - id: prjonavel
      title: "Prjónavélin"
      style: docked
      background: light
      collapse-level: 2
      contents:
        - text: "Yfirlit: Prjónavélin"
          href: prjonavel/index.qmd
        - section: "Vélbúnaður"
          contents:
            - prjonavel/velin.qmd
            - prjonavel/nalastyring.qmd
            - prjonavel/motor.qmd
        - section: "Hugbúnaður"
          contents:
            - prjonavel/styring.qmd
            - prjonavel/senda-mynstur.qmd
            - prjonavel/vefvidmot.qmd
        - section: "Notkun"
          contents:
            - prjonavel/prjon.qmd
            - prjonavel/honnun.qmd
    - id: sjonabok
      title: "Stafræn Sjónabók"
      style: docked
      background: light
      contents:
        - text: "Yfirlit: Stafræn Sjónabók"
          href: sjonabok/index.qmd
        - sjonabok/stafraening.qmd
        - sjonabok/nota.qmd
        - sjonabok/skreyta.qmd
        - sjonabok/prjonad.qmd
    - id: mynsturgerd
      title: "Mynsturgerð"
      style: docked
      background: light
      contents:
        - text: "Yfirlit: Mynsturgerð"
          href: mynsturgerd/index.qmd
        - mynsturgerd/fylki.qmd
        - mynsturgerd/mynd-i-mynstur.qmd
        - mynsturgerd/spunagreind.qmd
    - id: verkefnid
      title: "Verkefnið"
      style: docked
      background: light
      contents:
        - text: "Yfirlit: Verkefnið"
          href: verkefnid/index.qmd
        - verkefnid/bakgrunnur.qmd
        - verkefnid/nynaemi.qmd
        - verkefnid/teymi.qmd
        - verkefnid/verdmaeti.qmd
        - verkefnid/sumarid.qmd
    - id: meira
      title: "Meira"
      style: docked
      background: light
      contents:
        - hugbunadur.qmd
        - nam.qmd
        - ordalisti.qmd
        - heimildir.qmd
        - um.qmd
        - samband.qmd
        - nytt-vidfangsefni.qmd
  page-footer:
    left: "© 2026 Helga Ingimundardóttir · Háskóli Íslands"
    right:
      - text: "Heimildir"
        href: heimildir.qmd
      - icon: instagram
        href: https://www.instagram.com/hideftextiles/
        aria-label: Instagram
      - icon: github
        href: https://github.com/HiDefTextiles
        aria-label: GitHub

format:
  html:
    theme:
      - cosmo
      - styles/hi-site.scss
      - styles/hidef.scss
    css:
      - styles/hi-watermark.css
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    include-after-body:
      - _includes/eu-translator.html
      - _includes/page-nav.html
    toc: true
    toc-depth: 3
    toc-title: "Á þessari síðu"
    lang: is
    smooth-scroll: true
    anchor-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    lightbox: true
    mermaid:
      theme: neutral
